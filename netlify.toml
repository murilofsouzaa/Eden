# Netlify configuration for EDEN frontend
# Branch to deploy: set to 'main' in Netlify UI

[build]
  base = "frontend"
  publish = "dist"
  command = "npm ci && npm run build"

[build.environment]
  # Set Node version to match Vite requirement
  NODE_VERSION = "20.19.0"
  # Ensure build uses the frontend folder and publishes the dist output
  VITE_API_URL = "/api"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Note: Backend (Spring Boot) must be hosted separately. Define VITE_API_URL (or your env var) in Netlify site settings.
