name: Deploy na VPS

on:
  push:
    branches:
      - main
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Executar deploy via SSH na VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: BRANCH_NAME
          script: |
            set -euo pipefail

            case "${BRANCH_NAME}" in
              production)
                DEPLOY_DIR="$HOME/projects/eden"
                COMPOSE_PROJECT_NAME="eden"
                FRONTEND_HOST_PORT="3000"
                ;;
              main)
                DEPLOY_DIR="$HOME/projects/eden-staging"
                COMPOSE_PROJECT_NAME="eden-staging"
                FRONTEND_HOST_PORT="3001"
                ;;
              *)
                echo "Branch não permitida: ${BRANCH_NAME}"
                exit 1
                ;;
            esac

            echo "===== DEPLOY ====="
            echo "Branch: ${BRANCH_NAME}"
            echo "Diretório: ${DEPLOY_DIR}"
            echo "Projeto Docker: ${COMPOSE_PROJECT_NAME}"
            echo "Porta do frontend: ${FRONTEND_HOST_PORT}"

            cd "${DEPLOY_DIR}"

            echo "===== GIT ====="
            git fetch origin "${BRANCH_NAME}"
            git checkout -B "${BRANCH_NAME}" "origin/${BRANCH_NAME}"
            git log -1 --oneline

            # Escreve/Garante as variáveis no .env da pasta para o Docker Compose ler com 100% de certeza
            echo "COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME}" > .env.runtime
            echo "FRONTEND_HOST_PORT=${FRONTEND_HOST_PORT}" >> .env.runtime

            # Unifica o .env original (se existir) com as variáveis de runtime
            if [ -f .env ]; then
              grep -v '^FRONTEND_HOST_PORT=' .env | grep -v '^COMPOSE_PROJECT_NAME=' > .env.tmp || true
              mv .env.tmp .env
              cat .env.runtime >> .env
              rm -f .env.runtime
            else
              mv .env.runtime .env
            fi

            export COMPOSE_PROJECT_NAME
            export FRONTEND_HOST_PORT

            echo "===== BUILD ====="
            docker compose build --no-cache backend frontend

            echo "===== SUBINDO SERVIÇOS ====="
            docker compose up -d --build --force-recreate --remove-orphans

            echo "===== STATUS ====="
            docker compose ps
            docker compose images

            echo "===== LIMPEZA DE IMAGENS ====="
            docker image prune -f