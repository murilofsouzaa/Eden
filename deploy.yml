name: Deploy na VPS

on:
  push:
    branches:
      - main # Dispara o deploy sempre que houver push na branch main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Executar Deploy via SSH na VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            # Entra no diretório do projeto na VPS
            cd ~/projects/eden

            # Baixa as alterações do repositório
            git pull origin main

            # Recompila e sobe os containers em segundo plano
            docker compose down
            docker compose up -d --build

            # Limpa imagens e recursos antigos do Docker para não lotar o disco da VPS
            docker system prune -f
